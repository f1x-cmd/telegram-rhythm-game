<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#08080f">
  <title>Rhythm Game — Relax &amp; Drive</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-mode="relax">
  <div id="app">

    <!-- ─── Меню ─────────────────────────────────────────────────────────── -->
    <section id="menu" class="screen active">
      <button id="profile-chip" type="button" class="profile-chip" data-i18n="aria.profile" data-i18n-attr="aria-label">
        <span id="chip-avatar" class="avatar"></span>
        <span class="chip-text">
          <b id="chip-name">Player</b>
          <small id="chip-meta"></small>
        </span>
        <span id="chip-rank" class="chip-rank"></span>
      </button>
      <header class="menu-header">
        <h1>RHYTHM</h1>
        <p class="menu-subtitle" data-i18n="app.subtitle"></p>
      </header>

      <p id="ops-banner" class="ops-banner hidden"></p>

      <div class="daily-card">
        <div class="daily-head">
          <span class="daily-tag" data-i18n="daily.tag"></span>
          <span id="daily-status" class="daily-status"></span>
        </div>
        <p id="daily-title" class="daily-title">—</p>
        <div class="bar-outer"><div id="daily-fill" class="bar-fill"></div></div>
      </div>

      <div class="menu-section">
        <h2 data-i18n="section.mode"></h2>
        <div id="mode-list" class="mode-list"></div>
      </div>

      <div class="menu-section hidden" id="difficulty-row">
        <h2 data-i18n="section.difficulty"></h2>
        <div id="difficulty-list" class="chip-row"></div>
      </div>

      <button type="button" id="track-card" class="track-card" aria-expanded="false" aria-haspopup="dialog">
        <span class="track-card-kicker" data-i18n="section.track"></span>
        <span id="track-card-title" class="track-card-title">—</span>
        <span id="track-card-meta" class="track-card-meta"></span>
      </button>

      <p id="menu-error" class="menu-error"></p>

      <details class="menu-section settings">
        <summary data-i18n="menu.settings"></summary>
        <p class="hint settings-hint" data-i18n="menu.settingsHint"></p>
        <div class="lang-row">
          <label class="lang-label" for="lang-select" data-i18n="section.language"></label>
          <select id="lang-select" class="lang-select"></select>
        </div>
        <div class="offset-row">
          <label class="lang-label" for="offset-input" data-i18n="section.sync"></label>
          <input id="offset-input" type="range" min="-200" max="200" step="5" value="0">
          <span id="offset-value" class="offset-value">0</span>
        </div>
        <p class="hint" data-i18n="menu.calibrationHint"></p>
      </details>

      <div class="menu-dock">
        <button id="invite-btn" type="button" class="secondary-btn menu-invite-btn" data-i18n="profile.invite"></button>
        <p class="menu-invite-hint hint" data-i18n="menu.inviteHint"></p>
        <button id="play-btn" type="button" class="primary-btn play-hero"></button>
        <p id="play-meta" class="play-meta"></p>
        <p id="play-hint" class="play-hint hidden"></p>
      </div>
    </section>

    <!-- ─── Игра ─────────────────────────────────────────────────────────── -->
    <section id="game-screen" class="screen">
      <canvas id="game-canvas"></canvas>

      <!-- Spawn Zone: 0–15% -->
      <div class="hud-top">
        <div class="hud-row">
          <span id="score" class="score">0</span>
          <span id="mode-badge" class="mode-badge">RELAX</span>
          <span id="combo" class="combo"></span>
        </div>
        <div id="judgment" class="judgment"></div>
      </div>

      <!-- Touch Target Zone: 70–100% -->
      <div class="hud-bottom">
        <p id="coach" class="coach hidden"></p>
        <div id="shield" class="shield hidden"></div>
        <div class="bar-row">
          <span id="bar-label" class="bar-label">FLOW</span>
          <div class="bar-outer"><div id="bar-fill" class="bar-fill"></div></div>
        </div>
      </div>

      <button id="pause-btn" type="button" class="pause-btn" data-i18n="aria.pause" data-i18n-attr="aria-label">
        <span class="pause-bars" aria-hidden="true"></span>
      </button>

      <div id="pause-overlay" class="pause-overlay hidden">
        <p class="pause-title" data-i18n="pause.title"></p>
        <p id="pause-score" class="pause-score"></p>
        <button id="resume-btn" type="button" class="primary-btn" data-i18n="pause.continue"></button>
        <button id="save-score-btn" type="button" class="secondary-btn" data-i18n="pause.save"></button>
        <button id="pause-menu-btn" type="button" class="ghost-btn" data-i18n="pause.menu"></button>
      </div>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p id="loading-text" data-i18n="load.default"></p>
      </div>
    </section>

    <!-- ─── Результат ────────────────────────────────────────────────────── -->
    <section id="result-screen" class="screen">
      <h2 id="result-title" data-i18n="result.driveDone"></h2>
      <p id="record-badge" class="record-badge hidden" data-i18n="result.record"></p>

      <div class="result-main">
        <div id="result-rank" class="result-rank">S</div>
        <div class="result-score-box">
          <span id="result-score" class="result-score">0</span>
          <span class="result-score-label" data-i18n="result.points"></span>
        </div>
      </div>

      <ul id="result-rows" class="result-rows"></ul>
      <p id="result-daily" class="result-daily"></p>

      <img id="share-image" class="share-image" data-i18n="result.cardAlt" data-i18n-attr="alt">

      <div class="result-actions">
        <button id="share-btn" type="button" class="secondary-btn" data-i18n="result.share"></button>
        <button id="challenge-result-btn" type="button" class="secondary-btn" data-i18n="result.challenge"></button>
        <button id="download-btn" type="button" class="secondary-btn" data-i18n="result.download"></button>
      </div>

      <button id="retry-btn" type="button" class="primary-btn" data-i18n="result.retry"></button>
      <button id="menu-btn" type="button" class="ghost-btn" data-i18n="result.menu"></button>
    </section>

    <!-- ─── Кабинет ──────────────────────────────────────────────────────── -->
    <section id="profile-screen" class="screen">
      <header class="profile-head">
        <div class="profile-id">
          <span id="profile-avatar" class="avatar avatar-lg"></span>
          <div class="profile-id-text">
            <h2 id="profile-name">Player</h2>
            <p id="profile-handle" class="profile-handle"></p>
            <p id="profile-title" class="profile-title"></p>
          </div>
        </div>
        <div class="streak-pill" id="profile-streak-wrap">
          <span>🔥</span>
          <b id="profile-streak">0</b>
        </div>
      </header>

      <div class="hero-score">
        <span id="hero-points" class="hero-points">0</span>
        <span class="hero-label" data-i18n="profile.points"></span>
      </div>

      <div class="rank-cards">
        <button type="button" class="rank-card" data-board="global">
          <span class="rank-card-place" id="rank-global">—</span>
          <span class="rank-card-label" data-i18n="profile.global"></span>
        </button>
        <button type="button" class="rank-card" data-board="friends">
          <span class="rank-card-place" id="rank-friends">—</span>
          <span class="rank-card-label" data-i18n="profile.friends"></span>
        </button>
        <button type="button" class="rank-card" data-board="clan">
          <span class="rank-card-place" id="rank-clan">—</span>
          <span class="rank-card-label" data-i18n="profile.clan"></span>
        </button>
      </div>

      <ul class="stat-grid">
        <li><span data-i18n="profile.rating"></span><b id="stat-rating">800</b></li>
        <li><span data-i18n="profile.plays"></span><b id="stat-plays">0</b></li>
        <li><span data-i18n="profile.best"></span><b id="stat-best">0</b></li>
        <li><span data-i18n="profile.combo"></span><b id="stat-combo">0</b></li>
      </ul>

      <div class="board-tabs" role="tablist">
        <button type="button" class="board-tab selected" data-board="global" data-i18n="profile.global"></button>
        <button type="button" class="board-tab" data-board="friends" data-i18n="profile.friends"></button>
        <button type="button" class="board-tab" data-board="clan" data-i18n="profile.clan"></button>
      </div>
      <p id="board-hint" class="board-hint"></p>
      <ol id="board-list" class="board-list"></ol>
      <p id="board-empty" class="board-empty"></p>

      <div id="clan-form" class="clan-form hidden">
        <div class="clan-row">
          <input id="clan-name" type="text" maxlength="18" autocomplete="off">
          <button id="create-clan-btn" type="button" class="secondary-btn" data-i18n="profile.createClan"></button>
        </div>
        <div class="clan-row">
          <input id="clan-code" type="text" maxlength="4" autocomplete="off" class="clan-code-input">
          <button id="join-clan-btn" type="button" class="secondary-btn" data-i18n="profile.joinClan"></button>
        </div>
      </div>

      <div id="clan-actions" class="clan-actions hidden">
        <p id="clan-banner" class="clan-banner"></p>
        <div class="result-actions">
          <button id="share-clan-btn" type="button" class="secondary-btn" data-i18n="profile.shareClan"></button>
          <button id="leave-clan-btn" type="button" class="ghost-btn" data-i18n="profile.leaveClan"></button>
        </div>
      </div>

      <div class="viral-row viral-row--solo">
        <button id="challenge-btn" type="button" class="primary-btn" data-i18n="profile.challenge"></button>
      </div>

      <div class="donate-bar">
        <div class="donate-copy">
          <b data-i18n="profile.donateTitle"></b>
          <p data-i18n="profile.donateHint"></p>
        </div>
        <div id="donate-packs" class="donate-packs"></div>
      </div>
    </section>

    <nav id="app-nav" class="app-nav">
      <button type="button" class="nav-btn selected" data-nav="menu">
        <span class="nav-icon">▶</span>
        <span data-i18n="nav.play"></span>
      </button>
      <button type="button" class="nav-btn" data-nav="profile">
        <span class="nav-icon">◆</span>
        <span data-i18n="nav.profile"></span>
      </button>
    </nav>

    <div id="library" class="library hidden">
      <div class="library-sheet">
        <header class="library-head">
          <h2 data-i18n="library.title"></h2>
          <button id="library-close" type="button" class="library-close" data-i18n="library.close" data-i18n-attr="aria-label">✕</button>
        </header>
        <input id="library-search" type="search" class="library-search hidden" autocomplete="off" enterkeyhint="search">
        <div id="library-tabs" class="library-tabs" role="tablist">
          <button type="button" class="chip selected" data-lib-tab="mode"></button>
          <button type="button" class="chip" data-lib-tab="mine"></button>
          <button type="button" class="chip" data-lib-tab="all"></button>
        </div>
        <div id="library-list" class="track-list"></div>
        <p id="library-empty" class="hint hidden"></p>
        <label class="upload-btn" for="custom-track" data-i18n="menu.upload"></label>
        <input id="custom-track" type="file" accept="audio/*" hidden>
        <p id="custom-track-hint" class="hint hidden" data-i18n="menu.customHint"></p>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
